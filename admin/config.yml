backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: editorial_workflow
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{year}}/{{month}}/{{day}}/{{slug}}"
    fields:
      - label: Layout
        name: layout
        widget: hidden
        default: post
      - label: Title
        name: title
        widget: string
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss Z"
      - label: Description
        name: description
        widget: text
        required: false
      - label: Body
        name: body
        widget: markdown

  - name: pages
    label: Pages
    files:
      - label: About
        name: about
        file: about.md
        fields:
          - label: Layout
            name: layout
            widget: hidden
            default: default
          - label: Title
            name: title
            widget: string
          - label: Body
            name: body
            widget: markdown
